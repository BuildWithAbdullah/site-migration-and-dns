<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example</title>
  <link rel="canonical" href="https://www.example.org/">
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="https://cdn.assetprovider.example/widget.js" defer></script>
  <style>
    .promo { background-image: url(https://cdn.assetprovider.example/promo.png); }
  </style>
</head>
<body>
  <img src="https://cdn.assetprovider.example/hero.jpg"
       srcset="https://cdn.assetprovider.example/hero.jpg 1x, https://cdn.assetprovider.example/hero-2x.jpg 2x"
       alt="A hero image" width="1200" height="600">
  <div style="background-image: url('https://cdn.assetprovider.example/paper.png')">
    <p>Welcome</p>
  </div>
  <form action="https://www.example.org/search" method="get">
    <label for="q">Search</label>
    <input id="q" name="q" type="search">
    <button type="submit">Go</button>
  </form>

</html>
