name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exact versions, never a bare major. actions/setup-node resolves a bare
        # major to the newest release of that line, so a job named '20' never
        # runs the floor the package claims to support.
        node: ['20.0.0', '22.23.4', '24.11.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test suite
        run: npm test

      - name: The real binary, over every pair, at every threshold
        run: npm run check:exit-codes

      - name: The entry points are wiring and nothing else
        run: npm run check:entries

      - name: The baseline example has to be clean
        run: npm run check:baseline

  floor:
    name: The declared engines floor, exactly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'

      - name: The runtime really is the floor and not the newest of its line
        run: |
          node -e "
          const want = 'v20.0.0';
          if (process.version !== want) {
            console.error('expected ' + want + ', got ' + process.version);
            process.exit(1);
          }
          console.log('running on ' + process.version + ', which is the declared floor');
          "

      - name: The package refuses to install on a runtime below its floor
        run: npm install --engine-strict

      - name: The suite passes on the floor
        run: npm test

  verifier:
    name: Repository verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Repository verifier
        run: npm run verify

      - name: The assertion total is a fact about the repository, not a count of its files
        # An assertion made once per file is a count of how many files the
        # repository has. This adds one document that nothing else is about and
        # requires the total not to move. Run directly rather than through npm
        # run, because npm run writes a banner to stdout.
        run: |
          total() { node tools/verify.mjs | sed -n 's/^Repository verifier: \([0-9]*\) assertions.*/\1/p'; }
          before=$(total)
          printf '# Unrelated\n\nA document nothing counts.\n' > docs/unrelated-for-ci.md
          after=$(total)
          rm docs/unrelated-for-ci.md
          echo "before=$before after=$after"
          if [ -z "$before" ]; then echo "could not read the assertion total"; exit 1; fi
          if [ "$before" != "$after" ]; then
            echo "adding one unrelated document moved the total from $before to $after"
            exit 1
          fi

      - name: The test count is the same number on this version as on the others
        run: npm run count:tests

  parse:
    name: Every shipped module parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Every source file parses as a module
        # This is the weakest check in the repository and is kept only as a
        # backstop. A file that is only parsed is a file with no coverage at
        # all, which is why the entry points were taken apart and why
        # check:exit-codes runs the binary itself.
        run: |
          for f in $(find src bin tools probe test -name '*.mjs'); do
            node --check "$f" || exit 1
          done
